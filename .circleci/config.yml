version: 2.1

# Setup workflow (dynamic config): decides whether the release workflow must be started,
# then continues the pipeline with .circleci/continue_config.yml.
#
# The release workflow is only started on the release branches (main, beta) when the commits
# since the last tag would produce a new version (feat, fix, perf, BREAKING CHANGE...).
# Docs/chore/test commits and the "chore(release): x.y.z [skip ci]" commit never start it.
setup: true

orbs:
  continuation: circleci/continuation@2.0.1

executors:
  node:
    docker:
      - image: cimg/node:24.21.0
    resource_class: small

jobs:
  setup:
    executor: node
    steps:
      - checkout
      - run:
          name: Detect whether a release is needed
          command: |
            RELEASE=false
            if [ "$CIRCLE_BRANCH" = "main" ] || [ "$CIRCLE_BRANCH" = "beta" ]; then
              if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then git fetch --unshallow -q; fi
              git fetch --tags --force -q origin
              npm ci --ignore-scripts --no-audit --no-fund
              RELEASE=$(node scripts/should-release.mjs "$CIRCLE_BRANCH")
            fi
            echo "release: $RELEASE"
            echo "{\"release\": $RELEASE}" > /tmp/pipeline-parameters.json
      - continuation/continue:
          configuration_path: .circleci/continue_config.yml
          parameters: /tmp/pipeline-parameters.json

workflows:
  setup:
    jobs:
      - setup
